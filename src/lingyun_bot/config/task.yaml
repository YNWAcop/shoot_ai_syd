# lingyun_bot 参数。改完不用编译，下次运行生效。

match_time_s: 120          # 比赛总时长
speed: 0.2                 # 行驶最高速度（m/s），写进 move_base
goal_xy_tolerance: 0.06     # move_base 到点的位置容差（米），任务框每边余量只有几厘米
goal_yaw_tolerance: 0.1     # 朝向容差（弧度），到框里后还会按 AMCL 再转准

# ---------- 点位（地图坐标：x 米, y 米, 朝向 度）----------
# 下面是实验室地图的大概位置，换车、换地图后用 mark_pose.py 在车上逐个记一遍
points:
  start: [-0.056, 0.089, 0.1]
  recog: [0.333, -0.132, 91.9]     # 识别区（车头对着卡片）
  p1: [0.974, -0.371, 2.5]         # 1 号框（环形靶）
  lane1: [0.100, -0.371, 0.0]     # 通道里的过渡点：从 1 号框退出来
  lane2: [0.100, -1.603, 0.0]     # 通道里的过渡点：到 2 号框门口
  p2: [0.947, -1.603, 2.1]       # 2 号框（旋转靶）
  lane3: [0.100, -2.854, 0.0]     # 通道里的过渡点：到 3 号框门口
  p3: [0.986, -2.854, 0.2]       # 3 号框（移动靶）
  end: [0.028, -3.255, -1.2]       # 终点

# 每一段依次经过哪些点（move_base 一个点一个点走）
routes:
  recog: [recog]
  p1: [p1]
  p2: [lane1, lane2, p2]
  p3: [lane2, lane3, p3]
  end: [end]

goal_timeout_s: 30         # 单个点最多走多久，走不到就去下一个
final_turn: true           # 到 1、2、3 号框后再原地把朝向转准（move_base 朝向只准到几度）
turn_tolerance_deg: 1.0

# ---------- 时间不够时少等 / 跳过 ----------
# 每个靶最多等多久 = min(这个靶的 timeout_s, 剩余时间 − 后面路上要花的时间 − end_reserve_s)。
# 后面路上要花的时间按这一局前面实际开的速度估。算出来不到 min_target_s 秒就不打这个靶，保证能到终点。
end_reserve_s: 8           # 终点播报等留的余量
goal_overhead_s: 2.5       # move_base 每走一个点，除了按速度走的时间外还要多花的秒数（起步、转向、到点前蹭）
min_target_s: 3            # 至少能给这么多秒才打

# ---------- 相机内参（和 track_tag 的标定文件一致）----------
camera: {fx: 671.39, fy: 668.23, cx: 332.72, cy: 274.54}

# ---------- 开枪 ----------
# 厂家的 shoot 节点（abot_bringup/shoot.launch）收到 /shoot 话题就开一枪
shoot_topic: /shoot
after_shot_s: 0.5          # 开完枪停多久再走

# ---------- 播报 ----------
voice:
  dir: /home/abot/748573/src/robot_slam/mp3
  player: [mplayer, -really-quiet]
  start: 00.mp3
  rotating: 'x{}.mp3'        # {} 换成旋转靶号
  moving: 'y{}.mp3'          # {} 换成移动靶号
  end: final.mp3

# ---------- 识别卡片（find_object，模板在 templates/101~115.jpg）----------
cards:
  look_s: 6.0                # 最多看几秒
  min_votes: 3               # 同一张卡认出几次才算
  default: [1, 6]            # 没认出来时用的 [旋转靶号, 移动靶号]
  answers:                   # 模板编号: [旋转靶号（算术答案）, 移动靶号（水果）]
    101: [1, 6]
    102: [2, 6]
    103: [3, 6]
    104: [4, 6]
    105: [5, 6]
    106: [1, 7]
    107: [2, 7]
    108: [3, 7]
    109: [4, 7]
    110: [5, 7]
    111: [1, 8]
    112: [2, 8]
    113: [3, 8]
    114: [4, 8]
    115: [5, 8]
  # 水果对应的移动靶号：榴莲 6、杨桃 7、山竹 8（按官方规则核对）

# ---------- 1 号点：环形靶（find_object，模板 28~31）----------
ring:
  ids: [28, 29, 30, 31]
  aim_x: 363.0               # 弹着点在画面里的横坐标（试射后按弹孔改：偏右就加大）
  tolerance_px: 6.0          # 靶心离弹着点这么近就开枪
  px_per_m: 247.0            # 车横移 1 米，靶心在画面里移多少像素
  look_s: 1.2                # 每次看多久（取中位数）
  shift_speed: 0.05          # 横移速度 m/s
  max_shift_m: 0.03          # 累计最多横移多少（别出框）
  tries: 3                   # 最多横移几次
  timeout_s: 9.0             # 超时直接开枪

# ---------- 2 号点：旋转靶（AR 码 1~5 在转轮上）----------
# 做法：先原地转一点车头，让转轮的圆正好经过弹着点（左或右交点），然后等目标码转到弹着点附近开枪。
rotating:
  aim: [350.5, 199.5]        # 弹着点 (u, v)
  tolerance_px: 7.0          # 目标码离弹着点这么近就开枪
  px_per_deg: 8.8            # 车头转 1 度，画面移多少像素
  align_tries: 2             # 对转轮最多转几次车头
  timeout_s: 18.0            # 到了 2 号点后最多待多久，到时间直接开枪

# ---------- 3 号点：移动靶（AR 码 6~8 在滑块上）----------
# 做法：车不动，等目标码走到弹着点附近开枪
moving:
  aim_u: 350.5
  tolerance_px: 6.0
  timeout_s: 14.0
