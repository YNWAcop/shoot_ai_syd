# ============================================================
# voice.yaml：语音播报
#
# 规则：开始和结束必须有明确播报；识别后要播报识别信息；播报期间车必须静止；内容为官方统一内容。
# !!! 下面用的是车上已有的录音（旧程序目录 robot_slam/mp3），内容没人核对过，赛前必须逐个听一遍；
# !!! 官方公布统一播报内容后，按内容重新录音替换这些文件。
# ============================================================

audio_dir: /home/abot/748573/src/robot_slam/mp3
player_command: [mplayer, -really-quiet]

# 每条播报 = 按顺序播放的音频文件列表。
# {rotating} {moving} 会替换成识别出的靶号，例如 x{rotating}.mp3 → x3.mp3
messages:
  start: [00.mp3]                          # 比赛开始（待核对）
  targets: ['x{rotating}.mp3', 'y{moving}.mp3']   # 旋转靶 X 号、移动靶 Y 号（旧程序 end.py 用的就是这组文件）
  end: [final.mp3]                         # 比赛结束（待核对）
