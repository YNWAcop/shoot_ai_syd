# ============================================================
# shooting.yaml：射击参数
#
# 标"待标定"的值必须在车上测（试射看弹孔、录包看目标运动），这里只是旧程序沿用下来的初值。
# 坐标说明（全部用像素，u 向右、v 向下，图像 640x480）：
#   环形靶：find_object 给出的靶心横坐标。
#   AR 靶：ar_track_alvar 的位置 (x, y, z) 换算成像素 u = fx·x/z + cx，v = fy·y/z + cy（内参见 system.yaml camera）。
#          不用"米"：车上 marker_size 参数和码的实际尺寸不一致，米制坐标整体放大约 2.9 倍。
# 标定弹着点：试射后量弹孔相对目标中心偏了多少厘米：H（偏右为正）、V（偏下为正）。
#   AR 靶（旋转、移动）：新的横坐标 = 旧值 + H × fx / (100 × 距离)；新的纵坐标 = 旧值 + V × fy / (100 × 距离)
#     1.5 米处 1 cm ≈ 4.5 像素。
#   环形靶：新的横坐标 = 开火时靶心像素 + H × 1.94（find_object 的像素只有理论值的 0.55 倍，见 ring.image_gain）
# ============================================================

shooter:
  port: /dev/shoot
  baudrate: 9600
  start_hex: '55 01 12 00 00 00 01 69'   # 开始射击（沿用旧程序）
  stop_hex: '55 01 11 00 00 00 01 68'    # 停止射击

# ---------- 1 号点：环形靶（静止）----------
ring:
  detector: rings                # 靶心从哪来：rings = 相机画面找同心圆（2026-10-22 起，src/shoot_race/ring_finder.py）；
                                 #   find_object = 旧做法。2026-10-22 车完全不动时 find_object 和真靶心差 +1~+12 像素、
                                 #   单帧跳 3~9 像素（2 米处 1 像素 ≈ 0.4 cm）；找同心圆同一组 0.1~0.2 像素。
                                 #   为 rings 时下面 rings 一节里的 aim_x_px、tolerance_px 等覆盖本节同名项（两种像素不通用）
  mode: vision                   # 打法：vision = 看靶平移对准；taught = 精定位到位直接开火（不看靶）；
                                 # taught_check = 先看 2 帧核对，偏差 ≤ check_px 就开火，否则转 vision。
                                 # 菜单 13 测完精定位重复性再决定（见 steps.ShootRingStep）
  check_frames: 2                # taught_check：核对用几帧
  check_px: 8.0                  # taught_check：核对允许的偏差（像素，约 4 cm；只拦"精定位出错、车被碰过"）
  check_wait_s: 1.5              # taught_check：停稳后这么久还没看到靶 → 照样开火
  accept_ids: [28, 29, 30, 31]   # find_object 的模板编号。28~31 是同一个靶在不同距离拍的模板，都接受
  max_obs_age_s: 1.5             # 从缓存里取最近多少秒的检测结果
  aim_x_px: 363.0                # 弹着点横坐标。2026-10-19 菜单 22 弹道测试（aimtest_205428，0.10 秒、8.19 V）：
                                 #   5 枪出 3 发，落在同一点：靶心左 0.9 cm、上 2.3 cm（录像 + 车上画面量，黑色 9 环半径约 3 cm）；
                                 #   开火时靶心像素平均 365.6 → 365.6 - 0.9 × 2.47 = 363.4，取 363
                                 #   （之前 365：2026-10-16 三次试射，0.07 秒，按旧 image_gain 0.55 换算）
                                 # 公式：新值 = 开火时靶心像素 + 弹孔偏右厘米数 × 2.47（偏左为负）
                                 #   2.47 = 理论 3.53 像素/cm（fx/D/100）× image_gain 0.70，见下面 image_gain
                                 # 高低车调不了：现在落点比靶心高约 2.3 cm（9 环上沿），要改只能调枪口俯仰
  tolerance_px: 3.0              # 允许偏差（像素）。按 image_gain 换算 1 像素 ≈ 4 毫米，3 像素 ≈ 1.2 cm，
                                 # 和枪本身的散布（±2~3 cm）、识别噪声（单帧 ±4 像素）相当，再严只会来回修正
  look_more_px: 6.0              # 偏差在 tolerance_px ~ 这个值之间：原地多看几帧再定，不急着平移（一帧 0.4 秒，平移一次约 2.5 秒）
  target_distance_m: 1.9         # 车到环形靶的距离（米，规则值）
  image_gain: 0.70               # 车平移时 find_object 像素实际变化 / 理论变化（fx·Δy/D）。平移量 = 偏差 / (fx × image_gain) × 距离
                                 # 2026-10-19 现在这个靶（aimtest_205334.bag）2 次平移：0.72、0.71（残差 0.2 像素）→ 0.70。
                                 #   用旧值 0.55 时第一次平移走过头 2.7 cm（要 9 cm 走了 11.5 cm），又得退回来
                                 # （2026-10-16 旧场地 10 次平移回归得 0.55，残差 2.3 像素）
                                 # 换场地后复核：菜单 4 演练几次（自动录包）→ 菜单 18（scripts/ring_bag_check.py）给出建议值
  vision_latency_s: 0.3          # 停稳后再等这么久，才用新的检测结果（find_object 2.6~4.5 帧/秒，延迟 0.1~0.4 秒）
  confirm_frames: 3              # 第一次看至少几帧（约 1.1 秒）
  recheck_frames: 2              # 平移后再看至少几帧（和之前的帧合起来估计，所以可以少看）
  max_sigma_px: null             # 估计误差（像素）小于这个才开火，否则原地多看几帧（null = 不卡，见 aiming.RingAimer）。
                                 #   2026-10-19 弹道测试：6 帧估计偏差 2.2 像素就开火，实际偏 4.3 像素，弹孔偏右 1.8 cm（4 发都在 9 环）。
                                 #   蒙特卡洛（tests/ring_monte_carlo.py）：每次平移车头偏 0.1~0.4 度时卡 1.5 并不更准、只是更慢、超时更多；
                                 #   车到位后不用平移（示教准）时才有用。先不开，等 1 号点示教位置标准后再试
  max_look_frames: 6             # 同一位置最多看几帧，还是差一点就平移
  # 平移前后看到的结果按可信度加权合并（见 aiming.RingAimer）：
  frame_noise_px: 3.6            # 单帧识别噪声标准差（像素）。2026-10-19 录包静止 1795 帧：3.55（10-16 旧场地 2.9）
  model_error: 0.3               # 平移换算（image_gain）的相对误差
  shift_yaw_px: 2.5              # 每次平移车身朝向偏差带来的像素误差（实测平移一次偏 0.1~0.4 度）
  hold_yaw_on_shift: true        # 平移时用同一面侧墙的偏角稳住车头（motion.hold_heading，菜单 22 一直这样做）
  reset_px: 8.0                  # 平移后新一轮和旧估计差超过这么多像素 → 旧的作废
  settle_s: 0.3                  # 平移完后要停稳多久才开始"看"
  # 修正方式是横向平移（参数见 system.yaml 的 lateral_shift），不是原地转向：
  # 2026-10-16 实测这台底盘原地转向死区很大（< 0.3 rad/s 不转），做不了零点几度的精细转向。
  max_shift_m: 0.025             # 累计最多平移 2.5 cm（10-25 原 5 cm 会出框；靶偏的大头改由 teach.py turn p1 转车头解决）
  rings:                         # detector = rings 时生效（覆盖本节同名项）。像素 = 原始相机像素（640x480）
    aim_x_px: 353.0              # 2026-11-01：手机视频 7 枪，稳定的 6 枪平均在靶心右 0.72 个黑色 9 环半径（约 7 像素、2 cm），开火时靶心 349.3 → 349.3+6.9≈356（原 350.5）。弹着点横坐标。2026-10-22 16:27 / 16:29 两组（0.07 秒，新子弹，视频 9、10，激光到靶 2.06 m）：
                                 #   开火时靶心 u=354.25（找同心圆，10 张画面都一样）；9 发弹孔在靶心左 1.3~1.9 cm（1 发 2.8 cm），
                                 #   平均左 1.67 cm、中位数左 1.51 cm = 3.95 / 3.58 像素（录像里靶环半径 ÷ 相机里 ≈ 3.97）
                                 #   → 354.25 - 3.95 = 350.3 / 354.25 - 3.58 = 350.7，取 350.5
                                 # 公式：新值 = 开火时靶心 u + 弹孔偏右厘米数 × 2.47（偏左为负；菜单 22 打完会算）
    tolerance_px: 2.0            # 允许偏差（像素）。1.9 米处 1 cm ≈ 2.47 像素，2 像素 ≈ 0.8 cm；
                                 #   左右弹道散布约 ±0.5 cm，10 环半径约 1.5 cm。再小底盘平移的最小一步做不到
    look_more_px: 2.0            # = tolerance_px：不"原地多看几帧"。找同心圆噪声只有 0.3 像素，多看也不会变
    frame_noise_px: 0.5          # 单帧噪声（像素）。车不动时同一组 0.1~0.2，留余量（停稳后车身还会轻微晃）
    overshoot_scale: 0.6         # 走过头一次以后，每次只平移算出来的 0.6 倍（小步平移会滑过头，见 aiming.RingAimer）
    vision_latency_s: 0.1        # 用相机拍摄时间戳，不用等识别节点；停稳后这么久拍的帧才用
    confirm_frames: 3
    recheck_frames: 2
    max_look_frames: 5
    max_obs_age_s: 1.5
    finder:                      # 找同心圆的参数（没写的用 ring_finder.DEFAULTS）
      search_u: [200, 480]       # 没有上一帧结果时在这个框里找（原始像素）。2 米处靶的 6 环外沿半径约 32 像素
      search_v: [120, 320]
      r_min_px: 4.0              # 用多大半径范围内的环：9 环外沿约 9.5、6 环外沿约 32.5（2 米）
      r_max_px: 32.0
      min_score: 5.0             # 得分低于这个当作没看到靶。2026-10-22 实测：靶心 12~78，墙、窗框、立柱最高 0.9
      max_rate_hz: 6.0           # 最多每秒处理几帧
  fire:
    shots: 2                     # 开几次火（2 次 × 0.07 s 出弹太多）
    burst_s: 0.07                # 电机转多久（秒）。2026-10-18 晚 0.07 秒 5 发只出 1~3 发（当时没记射击模块电压），
                                 #   在车上改成 0.10 试用，满电后用菜单 16 复测（记电压）再定。之前 2026-10-16 菜单 16 实测（每档 5 次）：
                                 #   0.03 卡弹约一半；0.05 卡 1 次、弹道不稳；0.07 全出（1 次出 2 颗）、弹道稳 → 选 0.07
    interval_s: 1.2              # 两次开火之间等待（旧程序："硬件恢复时间"）
    post_fire_wait_s: 0.2        # 打完再等多久离开

# ---------- 2 号点：旋转靶（AR 码 1~5 装在转轮上）----------
# 2025 场地实测（rotating.bag）：转轮约 43 秒转一圈（8.4 度/秒），5 个码在同一个圆上（半径约 29~33 像素），码之间相位差约 72 度。
# 做法（见 aiming.RotatingPlanner）：精定位后不动，拟合转轮，等目标码转到"圆周上离弹着点最近的点"时开火；
# 最近点也偏超过 hit_tolerance_px 才横向平移（横移开环误差大：2026-10-17 实测指令 15 mm 走了 26 mm，车身还会偏 0.2~0.4 度）。
# 最坏要等将近一圈，所以这一步允许超过 20 秒；等待时每隔 keepalive_still_s 秒前后挪一下，防止"20 秒状态不变"被判结束。
rotating:
  wheel_ids: [1, 2, 3, 4, 5]     # 转轮上所有码的编号（都用来拟合转轮）
  aim_u_px: 350.5                # 弹着点像素（相机画面）。2026-10-23 改 350.5（原 361.5，旧子弹）：10-22 新子弹 0.07 秒两组（视频 9、10）
                                 #   左右弹着点在相机画面 u ≈ 350.3~350.7（2 米处，同 ring.rings.aim_x_px）；1.5 米处左右视差约 1~2 像素，待实弹复核。
                                 #   高低 aim_v_px 还是旧子弹的值，调完枪口俯仰后要重标（菜单 17 / 22 + 录像）。
                                 # 以下是旧子弹时的记录：2026-10-19 21:32 转轮停住、菜单 22 对准 5 号码连打 5 发（aimtest_213248）：
  aim_v_px: 199.5                #   录像里落点都在 5 号码中心偏下一点（右 0.3 cm、下 0.8 cm，码宽约 13 像素 ≈ 3 cm），
                                 #   开火时 5 号码在 (360.3, 196.1) → 弹着点 (361.5, 199.5)。
                                 #   旁证：同晚移动靶 8 号码一发推算 (363.5, 204.6)；环形靶左右也在 362 左右。
                                 #   之前的 (360, 189)：2026-10-18 21:48 在车上画面里肉眼标的点，应该是还在飞的水弹，比落点高约 10 像素（2.4 cm），
                                 #   转轮转着时按它算开火时机，水弹会落在码下面约 2.4 cm，打不中。之前的 366/214 也作废。
                                 #   更早：2026-10-17 录像碎片 u 364.7~367.4、v 192~219；旧程序换算 336.4/201.2
  fire_side: any                 # 2026-10-23 改 any：左右交点都瞄，算上扭车头的准备时间、目标码哪边先到打哪边（以前 right：只打右侧）。
                                 #   any / left / right，见 aiming.RotatingPlanner
  correction: servo              # 怎么对准交点（2026-10-23 v30 改 servo）：
                                 #   servo = 边看边对（aiming.RotatingServo）：偏得多原地扭车头、偏得少横移，一直看着画面修，
                                 #           不用每动一次停下来重新观察 1 秒；仿真平均约 13 秒、最长约 25 秒（v29 实测 20~35 秒）。参数在下面 servo 一节
                                 #   twist = v29：停稳观察 → 扭车头 → 停稳再观察（参数 twist_* / plan_twist_*，见 aiming.RotatingPlanner）
                                 #   shift = 更早的做法：只横向平移（最多 max_shift_m = 5 cm，够不着约 9 cm 的转轮半径）
  servo:
    observe_s: 0.8               # 至少有这么长的转轮数据才规划（车动着拍的也算，进这一步前精定位那段画面一般就够）
    window_s: 6.0                # 拟合转轮用最近多少秒（转速、相位；每帧单独定圆心，车动着也行）
    prep_base_s: 1.5             # 规划：对准要的时间 = prep_base_s + 偏差 / servo_px_s + hold_s，来不及就打另一侧（约半圈后）
    servo_px_s: 15.0             #   2026-10-23 实车：修 41 / 45 像素分别 4.9 / 4.0 秒对准
    twist_px_per_deg: 8.8        # 规划时判断够不够得着：扭 1 度画面移多少像素（实车 10-23 两次实测 8.9 / 8.5）。每扭一下按实测更新
    lateral_px_per_m: 313.0      #   横移 1 米画面移多少像素（有效焦距 470 / 1.5 m，1 cm ≈ 3.1 像素）。每移一下按实测更新
    tolerance_px: 3.0            # 对准到这以内就停（等的时候漂到 wait_keep_px 以内照样开火）。
                                 #   2026-10-23 由 2.5 改 3：横移最小一下约 1 cm ≈ 3 像素，2.5 在容差边上来回修
    release_px: 1.0              # 预计停下来时离目标还差这么多就松开
    coarse_px: 10.0              # 偏差大于这个原地扭车头（1 度约 8.8 像素），小于这个横移（1 cm 约 3 像素，细）
    coarse_max_px: 14.0          # 扭过头一次，下次粗细分界放宽（最多到这）：多用横移细修（横移上限 5 cm ≈ 15 像素）
    yaw_min_rate: 0.25           # 原地扭的角速度指令（rad/s）。垫子上实际只转出 0.25~0.38 倍，小于约 0.25 转不动（同 yaw_twist.min_rate）
    yaw_max_rate: 0.4
    yaw_gain: 0.01               # rad/s 每像素（偏差大时快一点）
    yaw_coast_s: 0.8             # 松开后画面还会移 = 松开时画面速度 × 这么多秒（每扭一次按实测更新；10-23 实车学到 0.6~1.0）
    lateral_min_speed: 0.03      # 横移速度（m/s）。驱动按整数 cm/s 截断，程序发整数 cm/s；0.03 起步约 0.7 秒、滑得少
    lateral_max_speed: 0.05
    lateral_gain: 0.004          # m/s 每像素
    lateral_coast_s: 0.4         # 横移松开后画面还会移 = 画面速度 × 这么多秒（每次按实测更新）
    yaw_bump: 0.05               # 发了 stall_s 秒画面还不动：指令加大这么多（最多加 3 次）
    lateral_bump: 0.01
    start_s: 0.4                 # 底盘起步死区：松开后这么久内不判断停没停、不判断卡住
    stall_s: 1.0
    max_move_s: 4.0              # 一下扭/平移最多多久
    stable_px_s: 3.0             # 画面移得慢于这个（像素/秒）算停稳
    hold_s: 0.3                  # 对准后停稳这么久才进入等待
    max_flips: 3                 # 扭过头这么多次以后不再扭（只横移）
    max_moves: 8                 # 一次对准最多动几下，超过就按现在的位置等
    max_align_s: 8.0             # 一次对准最多多久
    hold_heading: true           # 横移时稳车头（里程计朝向）：车头偏 1 度画面就偏约 9 像素，比横移 1 cm 大得多
    hold_gain: 3.0               #   回转角速度 = 3 × 偏角（rad/s，最多 0.2）。motion.hold_heading 默认 1.5，横移只走几厘米，要回得快一点
    corner_lever_m: 0.23         # 车角离转动中心（含枪管）。扭 + 横移合起来：车角横向多出 = |横移| + 0.23 × sin|扭的角度| ≤ max_corner_m
    max_corner_m: 0.06           #   单项上限仍是 max_twist_deg（6 度 ≈ 2.4 cm）、max_shift_m（5 cm）。框边余量不够就改小
    realign_px: 4.0              # 等的时候偏差超过这个、离开火还有 realign_min_s 秒以上 → 再对一次
    realign_min_s: 3.0
    late_s: 0.3                  # 码过了交点这么久以内（偏差在容差内）还能开火：拟合有抖动，只给一个周期的窗口会被跳过去
    fire_max_rate_px_s: 8.0      # 画面还在移得比这快（像素/秒）不开火
  twist_px_per_deg: 8.8          # 车头转 1 度，画面里转轮移动多少像素。理论 = 有效焦距 470 × π/180 × (1 + 相机离转动中心约 0.1 m / 1.5 m)
                                 #   ≈ 8.8（有效焦距见 ring.image_gain：671 × 0.70）。扭过一次后程序按实测更新（限理论值 0.5~1.6 倍）
  max_twist_deg: 6.0             # 相对这一步开始时的车头最多扭几度。车头两角离中心 0.23 m：6 度横向多出 2.4 cm、前后多出 1.6 cm。
                                 #   交点离弹着点约一个半径（30 像素 ≈ 3.5 度）。框边余量不够的话改小
  twist_min_px: 10.0             # 要修的偏差小于这么多像素用平移（垫子上扭的最小一下约 3~4 度 ≈ 30 像素，小角度扭不准）
  plan_twist_deg_s: 3.0          # 规划时按这个扭转速度估算用时（含起步，偏保守）
  plan_twist_overhead_s: 4.0     # 扭车头的固定准备时间（停稳 + 重新观察 + 可能再补一次小平移）。留少了补完赶不上这一圈，要多等 43 秒
  wait_keep_px: 5.5              # 已经在等时偏差在这以内就接着等（容差 4 + 1.5，免得在容差边上来回跳、错过这一圈）
                                 #   旧值 336.4 / 201.2（旧程序换算）偏左约 30 像素 ≈ 6.6 cm，比码还宽，打不中主要是它
                                 #   环形靶实弹标定得 365（ring.aim_x_px），两者一致。菜单 20 的结果写进 shooting_taught.yaml 会覆盖这里
  hit_tolerance_px: 4.0          # 弹丸到达时目标中心离弹着点最多几像素才开火（1.5 米处 1 cm ≈ 4.5 像素）
  latency_s: 0.15                # 从决定开火到弹丸到靶的总时间（待标定；交点处码只移动约 4 像素/秒，不敏感）
  target_distance_m: 1.5         # 车到转轮的距离（米，规则值），像素 → 平移量换算用
  settle_s: 0.3                  # 停稳多久才开始观察
  fresh_after_s: 0.1             # 停稳后再过多久的帧才算"停稳后拍的"
  observe_s: 1.0                 # 规划前至少观察多久（转速要从这段数据里算）
  fit_window_s: 3.0              # 拟合转轮用最近多少秒的数据（越长转速越准）
  history_s: 4.0                 # 从缓存里取最近多少秒（≥ fit_window_s）
  min_markers: 3                 # 至少看到几个码才拟合
  outlier_px: 3.0                # 离拟合圆超过这么多像素的点丢掉
  min_omega_deg_s: 0.5           # 转速低于这个当作转轮没转
  max_shift_m: 0.05              # 最多平移多远（米，相对精定位后的位置），不出任务框
  hold_yaw_on_shift: true        # 横移时稳车头（motion.hold_heading）。2026-10-19 22:29 菜单 6：不稳车头时右移 45 mm，
                                 #   转轮在画面里几乎没动（车头同时左转约 1 度），只能偏 8 像素尽力而为开火
  max_corrections: 3             # 最多修正几次（扭车头、平移都算；2026-10-23 由 2 改 3：先扭一次、不准再扭或平移一次）
  plan_overhead_s: 2.5           # 规划时给"平移 + 停稳 + 重新观察"留的固定时间（秒）
  plan_speed_mps: 0.05           # 规划时按这个平移速度估算用时
  give_up_observe_s: 3.0         # 算出来要等太久时，至少观察这么久（≤ fit_window_s）再放弃：1 秒的数据转速误差可达 30%
  max_wait_s: 50.0               # 这一步最多等多久：最坏 = 一圈（43 s）+ 平移准备（约 3 s）
  reserve_after_s: 30.0          # 至少给后面的任务（去 3 号点、打移动靶、去终点、播报）留这么多秒
  keepalive_still_s: 12.0        # 等待中静止这么久就前后挪一下（必须 < 20）
  keepalive_nudge_s: 0.6         # keepalive 先后退、再前进各发这么久指令（0 = 不做）。底盘约 0.3 秒才起步，太短车不动。
                                 # 前后挪只改距离，画面里转轮几乎不动；以前左右挪会把横向位置带偏约 8 mm、朝向偏 0.4 度
  keepalive_speed_mps: 0.05      # keepalive 前后挪的速度
  keepalive_min_lead_s: 6.0      # 离开火不到这么久就不做 keepalive（来不及回来、停稳、重新观察）
  blind_timeout_s: 5.0           # 连续这么久看不清转轮 → 不干等，按 on_timeout 处理
  fire:
    shots: 1
    burst_s: 0.07                # 同环形靶（2026-10-18 由 0.07 改为 0.10 试用，见 ring.fire）
    interval_s: 1.2
    post_fire_wait_s: 0.2

# ---------- 3 号点：移动靶（AR 码 6~8 并排装在导轨滑块上）----------
# 2025 场地实测（moving2.bag）：匀速往返约 18 像素/秒（≈ 4 cm/s），单程约 6.8 秒、行程约 121 像素；
# 到端点立即换向，换向（速度低于一半）约 0.5 秒。车不动，预测到达时刻开火，避开换向（见 aiming.MovingPredictor）。
moving:
  aim_u_px: 350.5                # 弹着点像素。同 rotating（2026-10-23 按新子弹改，原 361.5，见 rotating.aim_u_px）。弹孔偏右 → 增大；偏左 → 减小
  target_distance_m: 1.5         # 车到滑轨的距离（米，规则值）。菜单 20 / 22 像素 ↔ 厘米换算用（以前缺这项，菜单 20 标移动靶会报错）
  aim_v_px: 199.5                # 只在 use_v 为 true 时用。同 rotating；落点比码中心（v≈195）低约 4 像素，在码上
  use_v: false                   # 移动靶只在水平方向运动，不卡高度
  tolerance_v_px: 8.0
  hit_tolerance_px: 4.0          # 弹丸到达时目标中心离弹着点最多几像素（码宽约 14 像素）。刚换完向时可能"晚一点"开火，误差不超过它
  latency_s: 0.15                # 从决定开火到弹丸到靶的总时间（待标定！18 像素/秒时 0.1 秒误差 ≈ 1.8 像素）
  fit_window_s: 0.3              # 用最近多少秒估计位置和速度
  run_window_s: 0.6              # 这段时间前后两半速度方向必须一致（刚换过向不开火）
  min_samples: 4                 # 0.3 秒内至少几帧（AR 实测 15~25 Hz）
  max_sample_age_s: 0.3          # 最新一帧超过这么旧就不用（码被挡住等）
  outlier_px: 8.0                # 和前后邻居中位数差这么多像素算误识别（相邻码间距约 27 像素）
  min_speed_px_s: 8.0            # 低于这个速度当作正在换向，不开火
  max_speed_px_s: 120.0          # 高于这个速度说明数据有问题，不开火。2026-10-23 由 40 改 120：2025 场地实测约 18，
                                 #   今年转轮比去年快近一倍（15.3 vs 8.4 度/秒），滑块要是也快到 40 以上，以前会一直判"数据有问题"不开火
  static_speed_px_s: 2.0         # 低于这个速度当作静止靶（手扶着测试时），在容差内直接开火
  end_margin_px: 6.0             # 弹丸到达时离已知行程端点不到这么多像素不开火（快换向了）
  end_margin_s: 0.15             #   且不到"速度 × 这么多秒"（滑块快时换向前减速的那段更长）
  history_s: 16.0                # 取最近多少秒找行程端点（要大于一个来回）
  fuse_codes: [6, 7, 8]          # 2026-10-25：三个码装在同一个滑块上一起动，目标码没认出来的帧用另外两个码补
                                 #   （偏移按同一帧两个码都认出来的帧实测，见 aiming.fuse_slider_codes）。[] = 只用目标码（以前的做法）。
                                 #   10-25 傍晚目标码每秒只认出 8~16 次、断档最长 7 秒，经过弹着点时没数据 → 8 局里 4 局等到 16 秒超时乱打；
                                 #   三个码合起来断档 ≤ 0.34 秒。用当天 24 局录包回放：超时 6 → 1（剩下那局滑块没动），开火误差中位 0.2 像素、最大 2.8
  fuse_min_pairs: 3              # 同一帧两个码都认出来至少这么多帧，才按实测偏移用这个旁码（偏移取中位数）
  fuse_layout_px: {6: 0.0, 7: 27.1, 8: 53.2}   # 实测帧数不够时用的先验：画面里相对 6 号码的横向位置（像素）。
                                 #   10-25 傍晚 8 局实测 6→7 约 27.1、6→8 约 53.2（10-23 为 26.2~27.3 / 51.7~53.7，随车停的远近差 1 像素左右）
  settle_s: 0.3
  intercept:                     # 2026-10-23：码要很久才回到弹着点时，原地扭车头去"截"它（aiming.MovingInterceptor）。
                                 #   10-23 实测滑块约 15 像素/秒、单程约 7.5 秒；6 号码行程 u≈254~363，弹着点 350.5 离右端只有约 12 像素，
                                 #   码往左走过弹着点后要等 9~12 秒。估算：6 号码平均 6.5 → 4.4 秒、最长 13.7 → 10 秒；7、8 号平均约 4.5 → 3.2 秒
    enabled: false
    stroke_px: {6: [254.0, 363.0], 7: [281.0, 390.0], 8: [307.0, 416.0]}   # 各码行程两端（画面 u）。10-23 19:03~19:07 菜单 8/9 录包实测
    stroke_heading_deg: -2.0     #   标定时车头相对侧墙的朝向（录包激光算的约 -1.6 ~ -2.6 度）。车头朝向不同按 twist_px_per_deg 换算；
                                 #   车停的位置不同时，程序看到码折返、或走出这个范围，会按实测修正（行程宽度不变）
    twist_px_per_deg: 8.8        # 车头转 1 度画面移多少像素（旋转靶 10-23 实测 8.5~8.9）
    max_twist_deg: 6.0           # 车头相对侧墙最多扭几度（同 rotating.max_twist_deg），规划时再留 twist_margin_deg 给滑过头
    twist_margin_deg: 0.8
    end_margin_px: 15.0          # 截击点离行程两端至少这么多像素（换向前后速度不稳，不在那打）
    min_gain_s: 2.5              # 截击比"不动等它回来"至少早这么多秒才扭（扭也有风险，省得少不值得；第二次扭要早 1.5 倍）
    max_turn_deg: 8.0            # 一次最多扭这么多度
    twist_start_s: 0.8           # 规划用：原地起步时间（死区约 0.3 秒 + 起步要连续发约 0.5 秒）。每扭一次按实测修正
    twist_rate_deg_s: 4.0        #   原地扭的速度（指令 0.4 rad/s 时实测约 4~4.5 度/秒）
    twist_coast_s: 0.5           #   松开后滑到停
    buffer_s: 0.5                #   截击点离"码到那"还要留的余量（估得不准时宁可不扭）
    unsure_margin_px: 8.0        #   行程两端还没亲眼看到（用的是标定值）时，截击点离端点再多留这么多像素
    twist_min_rate: 0.4          #   扭的最小角速度指令（rad/s）。system.yaml yaw_twist 默认 0.25 在垫子上只转约 3 度/秒
    twist_timeout_s: 5.0
    settle_s: 1.2                # 扭完到能开火：停稳 0.3 秒 + 重新攒约 0.6 秒数据（MovingPredictor 要看方向一致）+ 余量
    dwell_s: 0.4                 # 码在两端换向停顿（实测约 0.5 秒速度降到一半以下）
    min_span_s: 0.5              # 停稳后至少看这么久才算（判断方向、速度）
    max_twists: 2                # 一次打靶最多扭几次
  fire:
    shots: 1
    burst_s: 0.07                # 同环形靶（2026-10-18 由 0.07 改为 0.10 试用，见 ring.fire）
    interval_s: 1.2
    post_fire_wait_s: 0.2
