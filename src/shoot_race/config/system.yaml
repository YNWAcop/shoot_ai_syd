# ============================================================
# system.yaml：系统参数（话题、坐标系、速度上限、控制参数、日志）
# 一般装好车以后很少改。标"待实测"的值需要上车确认。
# ============================================================

loop_hz: 20                  # 主循环频率（Hz）
log_dir: ~/race_logs         # 每局记录的根目录
image_buffer_size: 15        # 缓存最近多少帧相机图像（识别时从中选最清晰的）
set_initial_pose: true       # 开赛前把 AMCL 初始位姿设成 field.yaml 的 start 点

topics:
  scan: /scan_filtered       # 激光（已滤掉车身自身的点）
  wheel_odom: /wheel_odom    # 轮速里程计（有速度）。注意 /odom 只有位置没有速度，判断停稳不能用它
  camera: /usb_cam/image_raw
  ar: /ar_pose_marker        # ar_track_alvar 输出
  ring: /object_position     # find_object 输出：x=靶心像素横坐标，z=模板编号，255=没看到
  cmd_vel: /cmd_vel
  initial_pose: /initialpose

frames:
  map: map
  odom: odom                 # robot_pose_ekf 的输出坐标系（环形靶原地转向用它的朝向）
  base: base_link

laser_offset_x: 0.06         # 激光雷达在车中心前方多少米（URDF：laser_joint xyz 0.06 0 0.18）

# 相机内参（来自 track_tag/camera_calibration.yaml，640x480）。AR 码位置换算成像素、像素偏差换算成平移量都用它
camera:
  fx: 671.39
  fy: 668.23
  cx: 332.72
  cy: 274.54

# ---------- 横向平移（三个靶的对准都用它：车不转向，只左右平移）----------
# 用激光侧墙距离做反馈（里程计横向高估约 3 倍、分辨率只有 1 cm）。
# 2026-10-16 低速平移实测：0.02 m/s 不动；0.03 m/s 起步要 0.7 s；0.05 m/s 起步要 0.4 s。
# （当时电池电压偏低，满电后用菜单 19 底盘诊断复测，起步变快的话可以减小 min_speed、stall_s）
lateral_shift:
  gain: 2.0                  # 剩余平移距离（米）→ 横向速度（m/s）的比例
  max_speed: 0.08            # m/s
  min_speed: 0.05            # m/s，再小底盘起步太慢或不动。驱动按整数 cm/s 下发，小数部分直接截掉
  tolerance_m: 0.003         # 到位容差（米）；激光墙距噪声约 1~2 mm
  stall_s: 2.0               # 剩余距离这么久不减小，才认为卡住（底盘起步要"攒劲"）
  coast_s: 0.25              # 松油门后还会滑 = 激光实测横向速度 × 这么多秒。2026-10-17 录包：0.05 m/s 时滑约 11 mm
  fine_below_m: 0.025        # 2026-10-22：要走的距离小于这个就用 fine_speed 慢慢走（环形靶找同心圆后要对到 ±0.8 cm，
  fine_speed: 0.03           #   0.05 m/s 走 1~2 cm 常常走过头来回修正）。0.03 m/s 起步约 0.7 秒、滑得少（2026-10-16 实测）

# ---------- 原地扭车头（2026-10-23，旋转靶左右交点用，见 aiming.YawTwister）----------
# 激光侧墙偏角做反馈（同菜单 22 粗调）。垫子上原地转指令只转出约 0.25~0.38 倍、0.1 rad/s 以下几乎不动；
# 松开后还会转（死区约 0.25 s + 惯性 0.3 s），所以按实测转速 × coast_s 提前松开，扭一次不来回修，停稳后看画面再修
yaw_twist:
  gain: 2.0                  # 剩余角度（弧度）→ 角速度指令（rad/s）
  max_rate: 0.5              # rad/s（指令）。垫子上约实转 0.15 rad/s ≈ 9 度/秒
  min_rate: 0.25             # rad/s。菜单 22 粗调实测垫子上太小转不动
  tolerance_deg: 0.4         # 到位容差（1.5 米处 0.4 度 ≈ 3.5 像素，剩下的停稳后看画面再修）
  coast_s: 0.6               # 松开后还会转 = 实测角速度 × 这么多秒（同菜单 22 粗调实车用的 0.6；每扭一次按实测更新）
  stall_s: 2.0               # 剩余角度这么久不减小就算卡住
  timeout_s: 4.0             # 一次扭最多多久

drive_mode: direct           # 默认行驶方式：direct=自写路径跟随（快）；move_base=旧方式（稳妥备用）

# ---------- 底盘响应模型（行驶、精定位预测"松油门后滑到哪"，见 motion.ChassisModel）----------
# 2026-10-17 全流程录包 full_212336.bag 拟合：指令发出后约 0.3 秒（0.35~0.5）才开始动，再按时间常数约 0.3 秒跟上；
# 稳态只能到指令的：后退 0.9、横移约 0.8、前进 0.6~1.0（横移完再前进最低，原因待查，可能和电量有关）。
# 换电池/换场地地面后用菜单 10 整局演练的录包复核（drive 录包里 /cmd_vel 和 /wheel_odom 对比）。
chassis:
  dead_time_s: 0.25          # 2026-10-20 16:19 录包按轮速计时间戳拟合 0.15（10-18 拟合 0.10~0.20）；0.30 时通道拐角停早 4~5 cm。
                             # 取 0.25 留余量：仿真里真实死区 0.15 / 0.30 / 0.45 时通道最小间隙 5.6 / 6.5 / 5.0 cm
  time_constant_s: 0.30
  # gain_forward / gain_backward / gain_lateral / gain_yaw / gain_yaw_inplace 随场地地面变，写在下面 surfaces 里
  wheel_blend: 0.2           # 每周期用轮速计修正多少（0 = 只信模型）。轮速计 1 cm/s 一跳，修正太多预测点会抖
  wheel_blend_yaw: 0.0       # 角速度不用轮速计修正：垫子上轮子打滑，轮速计报的角速度是实际的 2.4 倍

# ---------- 场地地面（比赛有两种材质，打滑差别很大，尤其是转向）----------
# 2026-10-21 起按地面分组。surfaces.<当前地面> 里的每一项覆盖本文件同名参数（chassis.gain_yaw 等），
# 整局换地面就改 surface 这一行；临时试：race.launch set:="system.surface=other"（同一个 set 里再写的单项照样生效）。
# 每种地面里要写全同一套参数名（check_config 会查）。新地面先跑菜单 19 → 4（原地转测试）和菜单 10 整局演练录包，再填数。
surface: mats
surfaces:
  mats:                      # 拼接泡沫垫（实验室现在这种）
    chassis:
      gain_forward: 0.85     # 取 0.7~1.0 的中间：偏大 → 提前停、差一点由精定位补；偏小 → 冲过头
      gain_backward: 0.92    # 2026-10-18 22:19 整局录包：0.35 m/s 后退实到 0.93（以前 10-17 拟合 0.90）
      gain_lateral: 0.92     # 同上：0.35 m/s 横移实到 0.92（以前 0.80 偏小 → 预测滑行偏短、刹车偏晚）
      gain_yaw: 0.36         # 边走边转。2026-10-18 / 10-19 / 10-20 录包（IMU 角速度 / 指令）：0.33~0.41
      gain_yaw_inplace: 0.25 # 原地转：0.2~0.35（指令越小越低）
    wall_align:
      min_yaw_rate: 0.10     # 精定位最小转向指令。0.1 rad/s 以下垫子上几乎转不动（16:19：0.04~0.06 时 2.5 秒只转 1 度）
  other:                     # 另一种材质：还没测，测了再改。先放 10-16 ~ 10-18 没铺垫子时（硬地面）实测的值
    chassis:
      gain_forward: 0.85
      gain_backward: 0.90    # 10-17 硬地面拟合
      gain_lateral: 0.80     # 10-17 硬地面拟合
      gain_yaw: 0.9          # 10-18 铺垫子前
      gain_yaw_inplace: 0.4  # 10-16 原地转测试 0.4~0.5
    wall_align:
      min_yaw_rate: 0.04     # 硬地面上 0.04 就转得动；用 0.10 时仿真里死区内多转、来回摆（6 局 9 次超时）

# ---------- 路径跟随（drive 步骤，direct 模式）----------
path_follower:
  max_speed: 0.50            # 最高速度 m/s。2026-10-21 全程改用爆发段的速度（原来 0.35）。固件上限 0.5（abot_bringup max_v_liner_x/y = 50 cm/s），
                             # 16:19 录包 0.5 m/s 后退时轮速计到 0.49，电机已接近空载转速，再往上提意义不大（见 README 底盘一节）
  corner_speed: 0.15         # 拐 90 度左右的弯时降到多少 m/s（转角 < 15 度的点不降速）
  decel: 0.8                 # 减速度 m/s^2（按预测停车点算，已经包含底盘滑行，不用再留余量）。2026-10-21 同爆发段（原来 0.5）
  max_yaw_rate: 2.2          # 最大转向角速度 rad/s（指令）。2026-10-21 原来 1.0：垫子上边走边转只转出 0.36、原地 0.25，去识别区 90 度要 4 秒多。
                             # 固件上限 2.5（max_v_angular_z = 250）；2.2 × 固件转向力臂 0.225 m ≈ 0.5 m/s，正好用满单轮速度。
                             # 和平移怎么分轮速见 motion.PathFollower（按"走到点正好转完"分配）。以前的说明：2026-10-17 边走边转 1.5 rad/s 时轮子饱和、平移只剩一半、车身乱晃；
                             # 0.8 时去识别区（0.4 m 转 90 度）到点还没转完
  yaw_gain: 3.0              # 朝向比例增益（用预测朝向）。2026-10-20：2.0 时最后 30 度按 1.3 秒时间常数慢慢收（垫子上边走边转只有指令的 0.38），
                             # 去识别区、去 1 号点各多花约 1 秒。5.0 在垫子上更快，但整局仿真（硬地面，转向增益 0.9）交接时还在转、转过头，
                             # 识别区精定位超时；3.0 两种地面都稳
  min_turn_rate: 0.45        # 到点后只剩原地转时的最小角速度（底盘 0.45 rad/s 以下原地基本转不动）
  lookahead_m: 0.20          # 引导点在路线上往前多远：lookahead_m + lookahead_s × 当前速度。越大拐角越圆、方向越稳
                             # （0.10 时 22:06 实测横移抖动大：位姿 1 cm 一跳，引导点太近方向跟着跳）
  lookahead_s: 0.4
  wheel_limit: 0.50          # 单个麦轮线速度上限 m/s（2026-10-21 同爆发段，原来 0.45）（|vx|+|vy|+wheel_k·|wz| 超过就按比例缩小平移）
  wheel_k: 0.225             # 转向对轮速的贡献系数（米）= 固件 wheel_track 225 mm（base_driver.cpp），URDF 轮心 0.12 + 0.108 = 0.228。原来 0.20
  goal_tolerance: 0.04       # 到终点的位置容差（米）；更精确的停靠交给贴墙精定位
  close_finish_m: 0.08       # 车已停住、离终点不到这么远 → 也算到了（不再低速点动，交给精定位）
  yaw_tolerance_deg: 4.0     # 中途路径点的朝向容差（度）
  handoff_yaw_deg: 6.0       # 到终点时朝向差多少以内就交给贴墙精定位（它按墙转，比 AMCL 准）。
                             # 2026-10-18 22:19：去 1 号点 AMCL 说差 4.6 度（墙量只差 1 度），行驶原地补不动，干等 2.3 秒超时
  sharp_corner_deg: 60       # 转角不小于这个的拐点（通道点处的直角弯）不切角：先走到拐点附近再转向
  corner_reach_m: 0.05       # 预测停车点离急弯拐点不到这么远，引导点才转到下一段
  turn_hold_m: 0.05          # 离终点不到这么远、朝向还没到：平移锁住，只原地转
  turn_release_m: 0.10       # 锁住后离终点超过这么远（被推开、定位跳了）才重新平移
  # 2026-10-20 16:19 菜单 10 录包复盘后加的三个（通道横移车头离挡板端头最近只有 0.6 cm、安全检查连停 5 次）：
  burst_switch_m: 0.015      # 爆发段（末端速度 0）预测停车点沿路线离拐点不到这么远才切下一段（原来离拐点 5 cm 内就切，横移时车还差 6~9 cm 没退到通道线）
  cross_gain: 4.0            # 贴线段（档位 track: true）横向纠偏：偏离路线 1 cm → 0.04 m/s 往回拉
  cross_max: 0.15            # 横向纠偏最大速度（m/s）；轮速超限时先缩沿线速度、保住纠偏
  yaw_sync: 1.0              # 大角度转向时按"能转 max_yaw_rate × chassis.gain_yaw × 这个系数"限制平移速度
  yaw_bandwidth: 1.5         # 朝向带宽（1/s）：指令 = 它 / chassis.gain_yaw（原地用 gain_yaw_inplace）× 误差，即实际转速 ≈ 1.5 × 误差。
                             # null = 用上面的 yaw_gain（指令增益）。垫子仿真：去识别区 4.8 → 3.9 秒，1 号点交接时朝向差从 7~11 度降到 4 度以内。
                             # 底盘转向增益（surfaces.<地面>.chassis.gain_yaw*）必须和场地地面一致，否则转过头来回摆
  # 分段档位（2026-10-20）：field.yaml paths 里写 {to: 路径点, profile: burst} 的那一段用这里的参数，其余段用上面的常规参数。
  # 爆发段 = 离开任务框往后退、通道里横移：加速猛、最高速度高，末端减速到 0（按预测停车点刹到拐点，停住再横移）；
  # 进任务框那一段用常规参数，停得准，精定位剩得少。
  # 仿真（tests/timing_sim.py，按 10-18 实车录包设的底盘和场地）：见 README 第 8 节
  profiles_enabled: true    # 先关着（比赛 = 全程常规）：菜单 10 / 11 回车即用爆发段试；实车验证没问题后改成 true
  profiles:
    burst:
      max_speed: 0.50        # 底盘固件上限 0.5 m/s（abot_bringup max_v_liner_x/y = 50 cm/s）。仿真：0.5 比 0.45 整局快约 0.8 秒
      accel: 1.5             # 加速度上限 m/s^2（常规 0.8，见 accel_limits.linear）
      decel: 0.8             # 减速度 m/s^2（常规 0.5）
      end_speed: 0.0         # 末端速度：减到 0 再换方向
      settle: false          # true = 到拐点先减到 0，等"新指令过了死区起作用时车已基本停住"再开下一段（停住再横移）。
                             # 仿真 8 组：停不停住，通道里离挡板/围栏的最小间隙都是 9.2~9.9 cm、往后冲过通道点的距离也一样，
                             # 只是拐角处旧方向没停就开始新方向的距离 1.4~4.6 cm（停住时 0~0.4 cm）；停住整局多约 1.7 秒，所以默认不停
      settle_speed: 0.15     # settle = true 时的"基本停住"：预测新指令起作用时车速低于这个（m/s）
      wheel_limit: 0.50      # 单轮速度上限。原来自动取 0.55（最高速度 + 0.05），横移 0.48 + 纠偏 0.07 时轮子饱和、纠偏被吃掉
      track: true            # 贴着路线直线走，偏了先纠偏（cross_gain）：通道横移要一直保持离挡板端头和后围栏各约 10 cm

accel_limits:
  linear: 1.5                # 线加速度上限 m/s^2。2026-10-21 同爆发段（原来 0.8）。16:19 录包实测加速、减速峰值约 1.7~1.8
  angular: 3.0               # 角加速度上限 rad/s^2

# ---------- 行驶安全检查（只在 direct 模式下生效）----------
safety:
  enabled: true
  front_length: 0.23         # 车身中心往前多远（米，含枪管）。2026-10-18 车头蹭到挡板端头时，接触点在中心前方 0.21 m；
                             # 2026-10-21 菜单 19 → 5 车头贴围栏实测 0.194（围栏那个高度最靠前的地方），枪管比它更靠前，所以保持 0.23
  rear_length: 0.18          # 车身中心往后多远（米）。2026-10-21 车尾贴围栏实测 0.148，但这里保持 0.18：
                             # 激光扫到的车自己的零件（线、支架）有的就在车尾边上（16:19 录包：中心后方 14.3 cm），
                             # 填 0.15 时它只陷进轮廓 0.7 cm、过不了 self_depth（2 cm）的筛选，会被当成障碍——
                             # 仿真里车一往后带方向就停（和 10-20 17:57 同一类问题）。多出的 3 cm 只让倒车时早停一点，
                             # 通道位置按激光量后围栏定，不受影响
  half_width: 0.155          # 车身半宽（米）。2026-10-21 尺量车宽约 30.5 cm（激光量不出贴墙的侧面）
  side_margin: 0.03          # 横向余量（米）
  stop_distance: 0.08        # 固定余量（米）。实际停车距离 = 这个余量 + v²/(2*brake_decel) + v*sensor_latency_s
  brake_decel: 0.54          # 底盘急停的等效减速度 m/s^2。2026-10-21 菜单 19 → 6 三次（0.44~0.46 m/s 松开，激光量滑行 0.245 / 0.211 / 0.215 m）
                             # 换算 0.54 / 0.74 / 0.69，取最小。原来估的 1.0：0.45 m/s 时按 0.24 m 留停车距离，实际滑 0.21~0.25，8 cm 余量被吃光
  sensor_latency_s: 0.15     # 激光数据的延迟估计（秒）
  self_depth: 0.02           # 陷进上面车身轮廓超过这么深的激光点当作车自己的零件，不算障碍（17:57 那局：车尾里 6.6 cm 深的点每帧都有）
  finish_if_blocked_within: 0.25   # 离最后一个路径点不到这么远时被挡住，就结束行驶、交给贴墙精定位（终点框贴着围栏时会发生）

# ---------- 墙线拟合 ----------
wall_fit:
  sector_half_angle_deg: 30  # 每面墙只用正对方向 ±30 度内的激光点
  distance_band: 0.40        # 只用距离在"预期墙距 ±0.40 米"内的点，排除挡板端头、靶架等
  min_points: 8              # 少于这么多点认为没看到墙
  outlier_threshold: 0.02    # RANSAC 判定"点在墙上"的距离阈值（米）
  max_yaw_offset_deg: 20     # 拟合出的墙偏角超过这个值就当作没看到（多半是把旁边的墙当成了这面墙）

# ---------- 贴墙精定位（align 步骤）----------
wall_align:
  linear_gain: 2.0           # 距离误差 → 速度 的比例 (1/s)
  max_linear_speed: 0.15     # m/s
  min_linear_speed: 0.02     # m/s，低于这个底盘不动（驱动把 <0.01 m/s 截成 0）
  distance_tolerance: 0.008  # 距离容差（米）。任务框每边余量只有 1~2 cm
  yaw_gain: 2.0              # 2026-10-20：垫子上原地只转出指令的 0.17，最后 1~2 度按 0.04~0.06 rad/s 慢慢蹭（1 号框 2.5 秒只转了 1 度）。
                             # 3.0 / 4.0 在垫子仿真里快 1~1.5 秒，但整局仿真（硬地面，原地 0.4）1 号框来回摆到超时，所以保持 2.0，
                             # 改成"蹭不动"时 boost 连同朝向增益一起放大（最多 boost_max 倍）。确认比赛场地也是垫子后可改 3.0
  max_yaw_rate: 1.0          # rad/s（原来 0.5）
  # min_yaw_rate（最小转向指令）随地面变，写在上面 surfaces 里
  yaw_bandwidth: 1.0         # 同 path_follower.yaw_bandwidth，按 chassis.gain_yaw_inplace 换算（垫子上指令增益 4.0）。null = 用 yaw_gain。
                             # 垫子仿真：1 号框精定位 4.4 → 2.6 秒（交接时还差几度，原来按 0.05 rad/s 慢慢蹭）
  yaw_tolerance_deg: 0.5     # 朝向容差（度）。1.9 米外 0.5 度约等于 1.7 厘米
  ok_cycles: 3               # 连续几个周期都在容差内才算完成
  misfit_deg: 12.0           # 定朝向那面墙的偏角和 AMCL 朝向推算值差超过这么多度 → 拟合错了（墙角处扫到两面墙），
                             # 只是不按它转向（距离照用）。AMCL 朝向自身会差约 4 度，6 度时 1、3 号框被误判（22:06）
  missing_finish_s: 1.5      # 需要的墙连续这么久看不到、看得到的（至少一面墙的距离）都已到位 → 提前结束（不干等超时）
  # 下面四个是 2026-10-20 加的（22:19 整局录包逐帧复盘：5 次精定位共 19 秒，约 6 秒耗在最后几毫米 / 零点几度上）。
  # 单个任务框可以在 field.yaml 里另设 distance_tolerance / yaw_tolerance_deg（识别区已放宽）。
  near_factor: 1.6           # 墙距误差都在 容差 × 这个数 以内（1.3 cm）、朝向在 容差 × near_factor_yaw 以内（0.65 度），
  near_factor_yaw: 1.3       # 且车 near_hold_s 秒内几乎没动 → 等车停稳后也算到位。朝向放得少：1.9 米外每 0.1 度 ≈ 3 mm，打靶时要多平移
  near_hold_s: 0.6
  stall_s: 0.6               # 误差超出容差、车 stall_s 秒内几乎没动（发了最小速度也推不动）→ 最小速度 ×1.5
  boost_max: 2.5             # 最多放大到 2.5 倍（平移 0.05 m/s、转向 0.10 rad/s）
  settle_m: 0.002            # "几乎没动"：这段时间前一半和后一半的平均墙距差 < 2 mm（0.02 m/s 在动的话会差 6 mm）
  settle_deg: 0.10           #             且平均朝向差 < 0.1 度（录包里 0.04 rad/s 慢慢蹭约 0.08 度，算"几乎没动"）

# ---------- 停稳判断 ----------
still_speed:                 # 轮速计速度低于这些值算"停住了"
  linear: 0.01               # m/s
  angular: 0.02              # rad/s
still_hold_s: 0.25           # 播报、拍照前需要连续停稳多久（秒）

# ---------- 开局自检 ----------
preflight:
  warmup_s: 2.0              # 启动后等多久再自检（让各话题数据先进来）
  max_topic_age_s: 2.0       # 话题超过这么久没更新算不正常
