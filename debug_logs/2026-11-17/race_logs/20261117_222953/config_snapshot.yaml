      yaw_ref_deg: -2.78
      yaw_side: right
    p2:
      walls:
      - distance: 0.5994
        side: right
      - distance: 1.2033
        side: back
      yaw_ref_deg: -1.29
      yaw_side: right
    p3:
      walls:
      - distance: 0.6176
        side: left
      - distance: 1.2462
        side: back
      yaw_ref_deg: -1.54
      yaw_side: left
    recog:
      distance_tolerance: 0.02
      walls:
      - distance: 0.3727
        side: front
      - distance: 0.5998
        side: left
      yaw_ref_deg: -6.57
      yaw_side: front
      yaw_tolerance_deg: 2.0
