    - 0.333
    - -0.132
    - 91.9
    start:
    - -0.056
    - 0.089
    - 0.1
mission:
  drive_timeout_scale: 1.0
  match_time_s: 120
  rehearsal_pause_s: 0
  steps:
  - id: say_start
    message: start
    name: 播报比赛开始
    timeout_s: 5
    type: say
  - id: go_recog
    name: 去识别区
    path: to_recog
    timeout_s: 8
    type: drive
  - box: recog
    id: align_recog
    name: 识别区精定位
    timeout_s: 5
    type: align
  - id: recognize
    name: 识别卡片
    timeout_s: 12
    type: recognize
  - id: say_targets
    message: targets
    name: 播报靶号
    timeout_s: 6
    type: say
  - id: go_p1
    name: 去1号点
    path: to_p1
    timeout_s: 8
    type: drive
  - box: p1
    id: align_p1
    name: 1号点精定位
    timeout_s: 6
    type: align
  - id: shoot_ring
    name: 打环形靶
    on_timeout: fire
    skip_if_less_than_s: 35
    timeout_s: 8
    type: shoot_ring
  - id: go_p2
    name: 去2号点
    path: p1_to_p2
    timeout_s: 15
    type: drive
  - box: p2
    id: align_p2
    name: 2号点精定位
    timeout_s: 6
    type: align
  - id: shoot_rot
    name: 打旋转靶
    on_timeout: fire
    skip_if_less_than_s: 40
    target: rotating
    timeout_s: 55
    type: shoot_ar
  - id: go_p3
    name: 去3号点
    path: p2_to_p3
    timeout_s: 15
    type: drive
  - box: p3
    id: align_p3
    name: 3号点精定位
    timeout_s: 6
    type: align
  - id: shoot_move
    name: 打移动靶
    on_timeout: fire
    skip_if_less_than_s: 25
    target: moving
    timeout_s: 19
    type: shoot_ar
  - id: go_end
    name: 去终点
    path: p3_to_end
    timeout_s: 10
    type: drive
  - box: end
    id: align_end
    name: 终点精定位
    timeout_s: 6
    type: align
  - id: say_end
    message: end
    name: 播报比赛结束
    timeout_s: 5
    type: say
recognition:
  capture_s: 0.4
  cards:
  - answer: 1
    file: card01.jpg
    fruit: durian
    text: 盘子里有2个苹果，吃掉1个，还剩几个苹果？
  - answer: 2
    file: card02.jpg
    fruit: durian
    text: 小红有5块糖果，分给小伙伴3块，小红还剩几块糖果？
  - answer: 3
    file: card03.jpg
    fruit: durian
    text: 笔筒里有4支蜡笔，拿走1支，还剩几支蜡笔？
  - answer: 4
    file: card04.jpg
    fruit: durian
    text: 树上有3只松鼠，又跑来1只，现在一共有几只松鼠？
  - answer: 5
    file: card05.jpg
    fruit: durian
    text: 桌子上有3个橙子，拿来2个，现在一共有几个橙子？
  - answer: 1
    file: card06.jpg
    fruit: starfruit
    text: 小明手里有3支铅笔，送给同学2支，小明还剩几支铅笔？
  - answer: 2
    file: card07.jpg
    fruit: starfruit
    text: 停车场有3辆小车，开走1辆，停车场还有几辆小车？
  - answer: 3
    file: card08.jpg
    fruit: starfruit
    text: 地上有2只小鸡，又来了1只小鸡，一共有多少只小鸡？
  - answer: 4
    file: card09.jpg
    fruit: starfruit
    text: 一共有5朵小花，摘走1朵，还剩几朵小花？
  - answer: 5
    file: card10.jpg
    fruit: starfruit
    text: 草地上有4只小羊，再走来1只，一共有几只小羊？
  - answer: 1
    file: card11.jpg
    fruit: mangosteen
    text: 树上停了4只小鸟，飞走3只，树上还剩几只小鸟？
  - answer: 2
    file: card12.jpg
    fruit: mangosteen
    text: 花丛有1只蝴蝶，又飞来1只，现在一共有几只蝴蝶？
  - answer: 3
    file: card13.jpg
    fruit: mangosteen
    text: 一共有5个气球，破掉2个，还剩下几个气球？
  - answer: 4
    file: card14.jpg
    fruit: mangosteen
    text: 盒子里有2块橡皮，再放进去2块，盒子里一共有几块橡皮？
  - answer: 5
    file: card15.jpg
    fruit: mangosteen
    text: 书包里有5本本子，没有拿走本子，书包里还有几本本子？
  default_targets:
    moving: 6
    rotating: 1
  fruit_aliases:
    durian:
    - 榴莲
    - 榴梿
    mangosteen:
    - 山竹
    - 莽吉柿
    starfruit:
    - 杨桃
    - 阳桃
    - 洋桃
    - 五角星果
