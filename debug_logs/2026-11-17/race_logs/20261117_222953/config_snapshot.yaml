    mangosteen: 8
    starfruit: 7
  offline:
    cards_dir: cards
    min_inliers: 12
    min_margin: 0.08
    min_score: 0.35
    orb_features: 2000
    template_scale: 0.6
  policy: vlm_first
  vlm:
    api_key_env: SYD_ARK_API_KEY
    api_key_file: ~/.ark_api_key_syd
    base_url: https://ark.cn-beijing.volces.com/api/v3
    extra_body:
      thinking:
        type: disabled
    jpeg_quality: 85
    max_image_width: 1024
    model: doubao-seed-2-1-pro-260915
    prompt: '这是一张任务卡片，上方是一道算术应用题，下方是一张水果图片。 请计算题目的答案（1到5之间的整数），并判断水果是榴莲、杨桃、山竹中的哪一种。
      只输出一行JSON，不要输出其他内容，格式：{"answer": 数字, "fruit": "水果名"}'
    request_timeout_s: 15
    wait_s: 10
