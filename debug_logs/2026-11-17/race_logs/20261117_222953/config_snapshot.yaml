    distance: 0.36
    enabled: true
    max_shift: 0.15
    side: back
    smooth: 0.4
    waypoints:
    - lane_p1
    - lane_p2
    - lane_p2b
    - lane_p3
  paths:
    p1_to_p2:
    - profile: burst
      to: lane_p1
    - profile: burst
      to: lane_p2
    - p2
    p2_to_p3:
    - profile: burst
      to: lane_p2b
    - profile: burst
      to: lane_p3
    - p3
    p3_to_end:
    - offset:
      - 0.08
      - 0.0
      profile: burst
      to: end
    to_p1:
    - p1
    to_recog:
    - recog
  waypoints:
    end:
    - 0.028
    - -3.255
    - -1.2
    lane_p1:
    - 0.1
    - -0.371
    - 0.0
